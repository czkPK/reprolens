[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "Evidence-constrained reproduction readiness auditor for open-source AI repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ReproLens contributors" }]
dependencies = []

[project.scripts]
repolens = "repolens.cli:main"
repolens-web = "repolens.web:main"

[project.urls]
Homepage = "https://github.com/czkPK/reprolens"
Repository = "https://github.com/czkPK/reprolens"
Issues = "https://github.com/czkPK/reprolens/issues"

[tool.setuptools.packages.find]
where = ["src"]
