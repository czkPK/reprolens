[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "licenselens"
version = "0.1.0"
description = "Evidence-constrained open-source license conflict diagnosis and remediation planner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LicenseLens contributors" }]
dependencies = []

[project.scripts]
licenselens = "licenselens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
